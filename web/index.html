<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ตั้งธีมก่อน paint แรก: อ่าน localStorage คีย์เดียวกับ MUI ThemeProvider (main.tsx) ไม่งั้นคนที่ใช้ธีมมืด
         จะเห็นหน้าสว่างแวบหนึ่งระหว่างรอ JS (InitColorSchemeScript ของ MUI ใช้ไม่ได้ เพราะมันออกสคริปต์เฉพาะตอน server render) -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mui-color-scheme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <!-- ฟอนต์ของธีม Bubblegum: Poppins (UI ทั้งหมด ตัวเลข/ละติน), Noto Sans Thai (อักษรไทย — Poppins ไม่มี), Fira Code (code)
         Lora เป็น serif token ที่ไม่มีที่ใช้ จึงไม่โหลด · น้ำหนักที่ใช้จริงมีแค่ 400/600 (theme.ts ชี้ fontWeightMedium/Bold
         ของ MUI มาที่ 600) และ Fira Code ใช้แค่ 400 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&family=Noto+Sans+Thai:wght@400;600&family=Poppins:wght@400;600&display=swap" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Hyacinthia Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
